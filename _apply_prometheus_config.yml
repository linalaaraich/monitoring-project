# Surgical apply of the Prometheus scrape config WITHOUT the prometheus role's
# "restart stack" handler (which restarts the whole monitoring compose).
# Renders prometheus.yml.j2 with the same inventory vars as the role, then
# hot-reloads Prometheus via the lifecycle API (--web.enable-lifecycle is on).
# Throwaway: `ansible-playbook -i inventory/newacct.yml _apply_prometheus_config.yml`
#
# Safe + additive: this only writes the scrape config + POSTs /-/reload; it
# does NOT touch k3s-token / k3s-ca.crt (those stay as already shipped) and
# does NOT restart any container.
- hosts: monitoring
  gather_facts: false
  become: true
  vars:
    prometheus_config_dir: /etc/prometheus
  tasks:
    - name: Render prometheus.yml (no stack restart)
      template:
        src: "{{ playbook_dir }}/roles/prometheus/templates/prometheus.yml.j2"
        dest: "{{ prometheus_config_dir }}/prometheus.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Hot-reload Prometheus config (no restart)
      become: false
      uri:
        url: "http://localhost:{{ prometheus_port | default(9090) }}/-/reload"
        method: POST
        status_code: [200, 204]
