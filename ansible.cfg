[defaults]
# A-13 (2026-06-04): default to the NEW-ACCOUNT inventory. The old default,
# inventory/tailnet.yml, pointed at old-account MagicDNS names that were torn
# down 2026-06-02 — so a bare `ansible-playbook playbooks/X.yml` (no -i)
# targeted dead hosts (a wrong-estate footgun). newacct.yml (account
# 321556173045) holds the live monitoring-vm, k3s-node, gpu-host, adolin-wsl.
# Stale inventory/{tailnet,production}.yml are kept one more session per the
# handoff; pass `-i inventory/<file>` explicitly to target them.
inventory = inventory/newacct.yml
private_key_file = ~/.ssh/ansible_key
remote_user = deploy
host_key_checking = False
forks = 3
pipelining = True
roles_path = roles
# A-14 (2026-06-04): stop generating .retry artifacts (they were getting
# committed despite the .gitignore rule). They're run-state noise, not IaC.
retry_files_enabled = False
timeout = 60

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
