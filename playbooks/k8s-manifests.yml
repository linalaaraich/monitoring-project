---
# Deploy K8s manifests to the k3s cluster (E3-06, E3-07, E3-08)
#
# This playbook applies raw K8s manifests that don't use Helm.
# It runs kubectl from the control machine (requires kubeconfig from k3s.yml).
#
# Usage:
#   ansible-playbook playbooks/k8s-manifests.yml                     # All
#   ansible-playbook playbooks/k8s-manifests.yml --tags otel         # OTel only
#   ansible-playbook playbooks/k8s-manifests.yml --tags nvidia       # NVIDIA only
#   ansible-playbook playbooks/k8s-manifests.yml --tags prometheus   # Prom RBAC only

- name: Deploy K8s manifests
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # A-12 (2026-06-04): prefer the `monitoring_vm_ip` host_var over
    # `ansible_host`. Under newacct.yml, `ansible_host` is a MagicDNS NAME
    # (observability-rca-newacct-monitoring) which does NOT resolve inside k3s
    # pods (containers don't inherit Tailscale's resolver) — re-running --tags
    # otel would have baked an unresolvable name into the OTel CM/DaemonSet and
    # silently dropped logs/traces. The host_var is the routable private IP
    # (10.0.1.105). Fall back to ansible_host, then the env var, then a loud
    # sentinel.
    monitoring_vm_ip: "{{ hostvars['monitoring-vm']['monitoring_vm_ip'] | default(hostvars['monitoring-vm']['ansible_host'] | default(lookup('env', 'MONITORING_VM_IP') | default('MONITORING_VM_IP_NOT_SET', true))) }}"
    manifests_dir: "{{ playbook_dir }}/../manifests"

  tasks:
    # ---------------------------------------------------------------
    # OTel Collector DaemonSet (E3-07)
    # ---------------------------------------------------------------
    - name: Create observability namespace
      command: kubectl apply -f {{ manifests_dir }}/otel-collector/namespace.yaml
      tags: [otel]

    - name: Apply OTel Collector RBAC
      command: kubectl apply -f {{ manifests_dir }}/otel-collector/rbac.yaml
      tags: [otel]

    - name: Template OTel Collector ConfigMap with monitoring VM IP
      template:
        src: "{{ manifests_dir }}/otel-collector/configmap.yaml"
        dest: /tmp/otel-collector-configmap-rendered.yaml
      vars:
        rendered_monitoring_ip: "{{ monitoring_vm_ip }}"
      tags: [otel]

    - name: Apply OTel Collector ConfigMap (with IP substitution)
      shell: |
        sed 's/${MONITORING_VM_IP}/{{ monitoring_vm_ip }}/g' \
          {{ manifests_dir }}/otel-collector/configmap.yaml | kubectl apply -f -
      tags: [otel]

    - name: Apply OTel Collector DaemonSet (with IP substitution)
      # 2026-06-04: the daemonset's MONITORING_VM_IP env was a baked-in literal
      # (10.0.1.105) and this sed looked for a placeholder that wasn't present, so
      # the literal shipped as-is. Now the manifest uses ${MONITORING_VM_IP} and
      # this sed substitutes it (matching the configmap step above). For newacct
      # monitoring_vm_ip=10.0.1.105, so the applied value is unchanged.
      shell: |
        sed 's/${MONITORING_VM_IP}/{{ monitoring_vm_ip }}/g' \
          {{ manifests_dir }}/otel-collector/daemonset.yaml | kubectl apply -f -
      tags: [otel]

    - name: Wait for OTel Collector pods to be ready
      command: kubectl rollout status daemonset/otel-collector -n observability --timeout=120s
      tags: [otel]

    # ---------------------------------------------------------------
    # NVIDIA Device Plugin (E3-06)
    # ---------------------------------------------------------------
    - name: Apply NVIDIA device plugin DaemonSet
      command: kubectl apply -f {{ manifests_dir }}/nvidia-device-plugin/daemonset.yaml
      tags: [nvidia]

    - name: Wait for NVIDIA device plugin to be ready
      command: kubectl rollout status daemonset/nvidia-device-plugin-daemonset -n kube-system --timeout=120s
      tags: [nvidia]

    - name: Verify GPU is schedulable
      command: kubectl get nodes -o jsonpath='{.items[0].status.allocatable.nvidia\.com/gpu}'
      register: gpu_count
      failed_when: gpu_count.stdout == "" or gpu_count.stdout == "0"
      ignore_errors: true
      tags: [nvidia]

    - name: Show GPU allocation
      debug:
        msg: "GPU resources available: {{ gpu_count.stdout | default('none detected') }}"
      tags: [nvidia]

    # ---------------------------------------------------------------
    # Prometheus RBAC for kubernetes_sd_configs (E3-08)
    # ---------------------------------------------------------------
    - name: Apply Prometheus scraper RBAC
      command: kubectl apply -f {{ manifests_dir }}/prometheus-rbac/rbac.yaml
      tags: [prometheus]

    - name: Wait for ServiceAccount token to be generated
      command: kubectl get secret prometheus-scraper-token -n observability -o jsonpath='{.data.token}'
      register: prom_token_b64
      until: prom_token_b64.stdout != ""
      retries: 10
      delay: 5
      tags: [prometheus]

    - name: Wait for ServiceAccount CA cert
      command: kubectl get secret prometheus-scraper-token -n observability -o jsonpath='{.data.ca\.crt}'
      register: prom_ca_b64
      until: prom_ca_b64.stdout != ""
      retries: 10
      delay: 5
      tags: [prometheus]

    - name: Decode token + CA locally
      shell: |
        echo '{{ prom_token_b64.stdout }}' | base64 -d > /tmp/k3s-prometheus-token
        echo '{{ prom_ca_b64.stdout }}'   | base64 -d > /tmp/k3s-prometheus-ca.crt
      tags: [prometheus]

    # Ship the token + CA to the monitoring VM so the Prometheus scrape
    # config can reference bearer_token_file: /etc/prometheus/k3s-token.
    # This closes the loop: operator runs `ansible-playbook site.yml` once,
    # and kubernetes_sd_configs starts scraping without any manual scp.
    - name: Ship k3s SA token + CA to monitoring VM
      delegate_to: "{{ groups['monitoring'][0] }}"
      become: true
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        # 0644 (not 0600): Prometheus runs as a NON-root user inside its
        # container and bind-mounts this dir read-only; 0600/root made the
        # bearer token unreadable -> kubelet/pod scrapes failed with
        # "unable to read authorization credentials". Dir is host-root and
        # all traffic is inside the Tailscale tunnel. (2026-06-04)
        mode: "0644"
      loop:
        - { src: /tmp/k3s-prometheus-token, dest: /etc/prometheus/k3s-token }
        - { src: /tmp/k3s-prometheus-ca.crt, dest: /etc/prometheus/k3s-ca.crt }
      tags: [prometheus]

    - name: Reload Prometheus (web.enable-lifecycle) so it picks up the new token + cluster_sd job
      delegate_to: "{{ groups['monitoring'][0] }}"
      become: true
      uri:
        url: "http://localhost:{{ prometheus_port | default(9090) }}/-/reload"
        method: POST
        status_code: [200, 204]
      ignore_errors: true
      tags: [prometheus]

    # ---------------------------------------------------------------
    # node-exporter DaemonSet (audit I-2, 2026-04-28)
    #
    # Closes the host-level metrics gap on the k3s node. Discovered by the
    # existing kubernetes-pods scrape job via prometheus.io/scrape annotations
    # (proxied through the k3s API server) — no prometheus.yml.j2 changes
    # required.
    # ---------------------------------------------------------------
    - name: Apply node-exporter DaemonSet (k3s host metrics)
      command: kubectl apply -f {{ manifests_dir }}/node-exporter/daemonset.yaml
      tags: [node-exporter]

    - name: Wait for node-exporter DaemonSet to roll out
      command: kubectl rollout status daemonset/node-exporter -n observability --timeout=90s
      changed_when: false
      tags: [node-exporter]

    # ---------------------------------------------------------------
    # kube-state-metrics (audit A-2, 2026-06-04)
    #
    # Cluster-wide workload state (deployment/pod/replica/restart metrics) — the
    # "is any workload down" signal behind the generic KubeWorkloadDown alert.
    # Was entirely absent on the new account. Scraped by the existing
    # kubernetes-pods SD via the pod annotations baked into the manifest.
    # ---------------------------------------------------------------
    - name: Apply kube-state-metrics
      command: kubectl apply -f {{ manifests_dir }}/kube-state-metrics/kube-state-metrics.yaml
      tags: [kube-state-metrics, prometheus]

    - name: Wait for kube-state-metrics to roll out
      command: kubectl rollout status deployment/kube-state-metrics -n observability --timeout=120s
      changed_when: false
      tags: [kube-state-metrics, prometheus]
