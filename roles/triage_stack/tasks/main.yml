---
# =============================================================================
# triage_stack — CODIFIES the live hand-managed GPU triage stack (/opt/triage).
# APPLY WITH CARE. Captured 2026-06-04 from the live host to close audit drift
# A-3 (the GPU host's docker-compose.gpu.yml + .env + the 7 ai-* containers
# were hand-managed, NOT under Ansible). The GOAL is that the repo MATCHES live,
# not to re-deploy now.
#
# Safe-by-default workflow:
#   1. Template the compose / .env / otel-config / drain3.ini onto the host.
#      Verify drift-free with `--check --diff` FIRST — it must report no
#      meaningful changes against the live files before you trust it.
#   2. Compose up/pull is GATED behind `triage_stack_apply` (default FALSE) so
#      a plain run can't restart the crown-jewel host. Set
#      `-e triage_stack_apply=true` only when you intend to (re)deploy.
#
# Ollama is NOT managed here — it runs as a host systemd unit (installed by EC2
# user-data); containers reach it at host.docker.internal:11434.
# =============================================================================

- name: Ensure the triage stack directory exists
  file:
    path: "{{ triage_stack_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Template the GPU triage docker-compose
  template:
    src: docker-compose.gpu.yml.j2
    dest: "{{ triage_stack_dir }}/docker-compose.gpu.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: restart triage stack

# G2: docker json-file log paths carry only the container ID, and the OTel
# `container` operator's add_metadata_from_filepath resolves NAMES only for the
# k8s path pattern — so docker logs fell back to one `gpu-stack` stream. Gather
# the live id→name map and template per-id OTTL rules so each container gets its
# own service_name stream. Re-rendered on every apply (IDs change on recreate).
- name: Gather running container id→name map (G2 per-container log naming)
  command: "docker ps --no-trunc --format '{% raw %}{{.ID}} {{.Names}}{% endraw %}'"
  register: triage_docker_ps
  changed_when: false
  check_mode: false

- name: Template the OTel Collector config
  template:
    src: otel-config.yaml.j2
    dest: "{{ triage_stack_dir }}/otel-config.yaml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: restart triage stack

- name: Template the Drain3 config
  template:
    src: drain3.ini.j2
    dest: "{{ triage_stack_dir }}/drain3.ini"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: restart triage stack

# .env carries the SMTP app-password (from GRAFANA_SMTP_PASSWORD on the
# controller). 0600 + gitignored. Fail loudly if the secret isn't set so we
# never silently render an empty password into the live escalation path.
- name: Assert SMTP password is available from the controller environment
  assert:
    that:
      - triage_smtp_password is defined
      - triage_smtp_password | length > 0
    fail_msg: >-
      GRAFANA_SMTP_PASSWORD is not set in the controller environment.
      Export it before running:  export GRAFANA_SMTP_PASSWORD="<gmail-app-password>"
  when: triage_stack_apply | bool

- name: Template the triage .env (secrets from controller env; mode 0600)
  template:
    src: env.j2
    dest: "{{ triage_stack_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  notify: restart triage stack

# G5: redirect the Ollama host systemd unit's stdout/stderr to a tailable file
# so the collector (which has no journalctl to read journald) can ship its logs
# as service_name=ollama. Applying the drop-in requires an ollama restart
# (brief — triage cold-start/retry covers the gap). GATED behind apply.
- name: Ensure ollama log dir + systemd drop-in dir exist (G5)
  become: true
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/log/ollama
    - /etc/systemd/system/ollama.service.d
  when: triage_stack_apply | bool

- name: Mirror the ollama unit's output to a tailable log file (G5)
  become: true
  copy:
    dest: /etc/systemd/system/ollama.service.d/cires-logfile.conf
    mode: "0644"
    content: |
      # Managed by ansible (roles/triage_stack, G5). The OTel collector image has
      # no journalctl, so mirror this unit's output to a file the filelog receiver
      # tails as service_name=ollama.
      [Service]
      StandardOutput=append:/var/log/ollama/ollama.log
      StandardError=append:/var/log/ollama/ollama.log
  register: ollama_logfile_dropin
  when: triage_stack_apply | bool

- name: Reload systemd + restart ollama to apply the log drop-in (G5)
  become: true
  systemd:
    name: ollama
    state: restarted
    daemon_reload: true
  when:
    - triage_stack_apply | bool
    - ollama_logfile_dropin is changed

# --- Compose lifecycle: GATED. Only runs when explicitly opted in. ----------
- name: Pull GHCR images
  community.docker.docker_compose_v2:
    project_src: "{{ triage_stack_dir }}"
    files:
      - docker-compose.gpu.yml
    pull: always
    state: present
  when:
    - triage_stack_apply | bool
    - triage_compose_pull | bool

- name: Bring up the triage stack
  community.docker.docker_compose_v2:
    project_src: "{{ triage_stack_dir }}"
    files:
      - docker-compose.gpu.yml
    state: present
  when: triage_stack_apply | bool

- name: Notice — apply gated off
  debug:
    msg: >-
      triage_stack_apply is false: templates were written to {{ triage_stack_dir }}
      but the compose stack was NOT (re)started. Re-run with
      -e triage_stack_apply=true to deploy.
  when: not (triage_stack_apply | bool)
