# =============================================================================
# OpenTelemetry Demo (Astronomy Shop) — CIRES integration values
# Sprint 5 EPIC13 / S5-MSB-01 — the microservice demo bed.
#
# Chart: open-telemetry/opentelemetry-demo 0.40.9 (app 2.2.0)
# Deployed into the `otel-demo` namespace on the k3s cluster
# (observability-rca-newacct-k3s). Install/upgrade:
#   helm upgrade --install otel-demo open-telemetry/opentelemetry-demo \
#     --version 0.40.9 -n otel-demo --create-namespace \
#     -f manifests/otel-demo/values.yaml
#
# INTEGRATION DECISION: the demo does NOT ship its own observability stack.
# All telemetry is routed into the EXISTING platform pipeline by pointing every
# component at the in-cluster collector already running in the `observability`
# namespace (otel-collector.observability.svc.cluster.local), which forwards
# traces -> monitoring-VM:4317 (Jaeger) and logs -> monitoring-VM:3100 (Loki).
# That is why every bundled backend below is disabled — we reuse one pipeline,
# avoid duplicate Jaeger/Prometheus/Grafana/OpenSearch, and keep the demo's
# logs flowing to Loki where Drain3 ingests them (the bed for S5-DRN-01's
# 3-tier component->app->system thresholds).
#
# NOTE (metrics gap, follow-up): the existing in-cluster collector has a
# traces + logs pipeline but no metrics->Prometheus forwarding path, so demo
# OTLP *metrics* are currently dropped. Traces + logs (what Drain3 + the 3-tier
# work need) flow fully. Adding a metrics pipeline is tracked as a follow-up.
# =============================================================================

# default.env is a LIST — helm REPLACES it wholesale, so we restate the chart's
# defaults and only change OTEL_COLLECTOR_NAME to the cross-namespace FQDN of
# the platform's existing collector.
default:
  env:
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_COLLECTOR_NAME
      value: otel-collector.observability.svc.cluster.local
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: cumulative

# O-3 (2026-06-10): accounting (the demo's .NET/Kafka consumer, known
# upstream-hungry) OOMKilled every ~17-19 min at the chart-default 120Mi limit
# (420+ restarts over 5d). Bumped to 256Mi AFTER first proving the new
# PodCrashLooping alert goes Pending->Firing on the real loop (real-induction
# evidence, 2026-06-10) — sequencing was deliberate: alert proven on live
# breach, then symptom fixed so the bed is stable for induction tests.
# Requests are left unset (default to the limit) — node had ~36% memory
# requests allocated at the time, so scheduling headroom is fine.
components:
  accounting:
    resources:
      limits:
        memory: 256Mi
  # 2026-06-11: expose the shop UI for demos (tailnet/VPC-internal only —
  # the k3s SG keeps NodePorts closed to the internet).
  frontend-proxy:
    service:
      type: NodePort
      nodePort: 30808

# Reuse the platform's single pipeline — disable everything bundled.
opentelemetry-collector:
  enabled: false
jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false
