grafana_port: 3000
prometheus_port: 9090

# Public-facing Grafana URL used in webhook payloads and email links. Without
# this Grafana defaults to http://localhost:3000 for every generated URL,
# which means the triage escalation email's "View Alert" link is useless
# on the recipient's machine. Default to the tailnet MagicDNS hostname so it
# survives EIP drift / account migrations (newacct.yml overrides this per-host
# to the same name, but the default must not point at a dead resource).
# 2026-06-04 (A-5): was the old-account EIP http://52.202.21.192:3000 — that
# host was torn down 2026-06-02. Switched to the MagicDNS hostname.
grafana_external_url: "http://observability-rca-newacct-monitoring:3000"

# Grafana SMTP config — Gmail App Password
# Generate app password: Google Account → Security → 2-Step Verification → App Passwords
grafana_smtp_host: "smtp.gmail.com:587"
grafana_smtp_user: "laaraichlina@gmail.com"
grafana_smtp_password: "{{ lookup('env', 'GRAFANA_SMTP_PASSWORD') }}"
grafana_smtp_from: "laaraichlina@gmail.com"
grafana_contact_email: "laaraichlina@gmail.com"

# Triage service webhook — Grafana Alerting sends all alerts here.
# As of 2026-05-21, the triage service runs on an AWS g5.xlarge in us-west-2
# (instance `i-03aec662b1a47ad8f`, A10G GPU, qwen2.5:14b primary +
# 7b fallback). Webhooks go through a Lambda autoshutoff gateway fronted by
# API Gateway: traffic-aware lifecycle, 20-min idle stop, SQS-buffered cold
# starts. The instance is reachable from the operator dashboard via Tailscale
# (`observability-gpu-uswest2`), but Grafana itself posts to the public
# API Gateway URL — Grafana doesn't need a tailnet route to reach it.
# Prior URL (adolin-wsl laptop): http://100.117.118.70:8090/webhook/grafana
# (kept as rollback fallback; do not delete adolin-wsl's container yet.)
triage_service_webhook_url: "https://p2j9dqjh3h.execute-api.us-west-2.amazonaws.com/webhook/grafana"

loki_port: 3100
jaeger_port_ui: 16686
jaeger_port_collector: 4317
badger_data_dir: /data/badger
grafana_admin_password: "admin"
grafana_datasources:
  - prometheus
  - loki
  - jaeger
prometheus_scrape_interval: "15s"
prometheus_retention_days: 15
prometheus_targets:
  # Monitoring VM — static targets (the observability stack itself).
  # App / network / AI workloads have moved into k3s — they are discovered
  # via kubernetes_sd_configs instead of listed here. See k3s_sd_enabled.
  - job: "mon-cadvisor"
    host: "{{ monitoring_vm_ip }}"
    port: "{{ cadvisor_port }}"
  - job: "mon-node-exporter"
    host: "{{ monitoring_vm_ip }}"
    port: "{{ node_port }}"
  - job: "prometheus"
    host: "{{ monitoring_vm_ip }}"
    port: "{{ prometheus_port }}"
  - job: "grafana"
    host: "{{ monitoring_vm_ip }}"
    port: "{{ grafana_port }}"
  - job: "loki"
    host: "{{ monitoring_vm_ip }}"
    port: "{{ loki_port }}"
  - job: "jaeger"
    host: "{{ monitoring_vm_ip }}"
    port: "14269"
  - job: "otel-collector"
    host: "{{ monitoring_vm_ip }}"
    port: "8888"
  # k3s host node_exporter — installed natively (apt prometheus-node-exporter)
  # by the node_exporter role in playbooks/k3s.yml. Without this entry the k3s
  # host's CPU/memory/disk are invisible to Prom, so any infra-level Grafana
  # rule (HighCpuUsage / MediumCpuUsage / etc.) on service=k3s-node never fires.
  # Added 2026-06-02 after the real-induction agent caught the gap.
  - job: "k3s-node"
    host: "{{ k3s_host_ip }}"
    port: "{{ node_port }}"

# --- GPU triage host (observability self-monitoring) ---
# The dedicated GPU EC2 box (us-west-2) runs the AI triage pipeline: the
# triage orchestrator (:8090) + 6 ai-* containers + host Ollama + the A10G.
# Until 2026-06-04 NONE of it was scraped, so the `triage-service-health`
# dashboard was 100% no-data (audit G1). The triage orchestrator already
# exposes a rich Prometheus endpoint on :8090/metrics that AGGREGATES the
# whole pipeline — triage_*, ollama_*, drain3_*, and triage_mcp_* (per-MCP
# request/latency) — so a single scrape of :8090 lights the dashboard. The
# individual MCP containers (:8091-:8095) bind only inside the GPU host's
# docker network (not host-published), so they cannot and need not be
# scraped directly; their telemetry surfaces via triage_mcp_* on :8090.
#
# Reachability: the central Prometheus reaches the GPU box over the TAILNET
# (verified 2026-06-04 from inside the prometheus container — both MagicDNS
# and the tailnet IP resolve+connect, HTTP 200). NO AWS SG change is needed;
# the tailnet bypasses SGs. We target the tailnet IP rather than the MagicDNS
# name to avoid coupling the in-container scrape to MagicDNS resolution (the
# same reason monitoring_vm_ip uses a private IP, not a hostname).
#
# node-exporter / DCGM-exporter for the GPU host (host CPU/mem/disk + A10G
# GPU/VRAM/temp metrics) are deployed by playbooks/gpu.yml (roles/triage_stack)
# and scraped via the gpu-node / gpu-dcgm jobs below once that apply lands.
gpu_triage_scrape_enabled: true
gpu_host_tailnet_ip: "100.114.76.43"   # observability-gpu-uswest2-newacct
gpu_triage_targets:
  # Triage orchestrator — exposes the whole pipeline's metrics (the metrics
  # the triage-service-health dashboard queries). Host-published on :8090.
  - job: "ai-triage-service"
    host: "{{ gpu_host_tailnet_ip }}"
    port: "{{ triage_service_port | default(8090) }}"
  # GPU host node-exporter (host CPU/mem/disk). Deployed by gpu.yml; the job
  # is harmless (DOWN) until the exporter container is up after that apply.
  - job: "gpu-node-exporter"
    host: "{{ gpu_host_tailnet_ip }}"
    port: "{{ node_port }}"
  # NVIDIA DCGM-exporter (A10G utilization, VRAM, temp, power). Deployed by
  # gpu.yml; harmless (DOWN) until the exporter container is up.
  - job: "gpu-dcgm-exporter"
    host: "{{ gpu_host_tailnet_ip }}"
    port: "9400"

loki_retention_days: 7

# --- Kubernetes service discovery ---
# Default ON: Prometheus uses kubernetes_sd_configs to discover every pod
# annotated with `prometheus.io/scrape: "true"` in the k3s cluster, routed
# through the API server proxy (no pod-network reachability required).
# Requires: /etc/prometheus/k3s-token and /etc/prometheus/k3s-ca.crt already
# present on the monitoring VM — the k8s-manifests.yml playbook ships them.
k3s_sd_enabled: true
# k3s_host_ip: set in group_vars/all.yml or group_vars/k3s_cluster.yml
