stack_dir: /opt/stack
admin_email: laaraichlina@gmail.com
ssh_port: 22

# --- Host firewall (UFW) ---
# Gated OFF by default: on AWS the security groups are the primary perimeter
# and a host firewall is redundant. But when enabled (on-prem / defence-in-
# depth), the rules must be CORRECT and PARAMETERIZED — never a hardcoded
# on-prem subnet that locks you out of an AWS host (A-9).
#
# `firewall_allowed_cidrs` is the allowlist of source CIDRs permitted inbound
# (in addition to SSH, which is always allowed from anywhere so you can never
# lock yourself out, and the tailnet, which is how the controller actually
# reaches these hosts). Default to the AWS VPC CIDR + the Tailscale CGNAT
# range (100.64.0.0/10) so the controller's tailnet path is always allowed.
# Override per-environment (e.g. add an on-prem mgmt subnet) in group_vars or
# inventory — do NOT hardcode a site-specific range here.
firewall_enabled: false
# AWS VPC CIDR (this account's VPC is 10.0.0.0/16). For on-prem, override.
vpc_cidr: "10.0.0.0/16"
# Tailscale CGNAT range — the controller reaches every host over the tailnet,
# so this MUST be allowed or enabling the firewall cuts off Ansible itself.
tailnet_cidr: "100.64.0.0/10"
firewall_allowed_cidrs:
  - "{{ vpc_cidr }}"
  - "{{ tailnet_cidr }}"
# Docker bridge networks (container -> host). Kept separate so it's obvious.
firewall_docker_cidr: "172.16.0.0/12"
# Control node source. No longer a hardcoded on-prem IP: the controller is on
# the tailnet, already covered by tailnet_cidr. Left empty by default; set it
# only if you have a specific non-tailnet control IP to allow.
ansible_control_ip: ""

# VM IPs — SET PER-INVENTORY (host_vars), NOT here.
# This is a SHARED default loaded by every group. Baking a concrete site IP here
# is the drift class that caused a past outage: a torn-down host's IP lingered in
# this shared default, masked only by a host_var override, and re-broke things on
# apply. So the default is now a LOUD placeholder — the preflight role rejects it,
# forcing the operator to set the real value as a host_var in their inventory.
# Our newacct.yml sets monitoring_vm_ip / monitoring_vm_public_ip as host_vars on
# each host, which (host_vars) beat this default — so our live deploy is unaffected.
monitoring_vm_ip: "CHANGE_ME_monitoring_host_ip"          # private/routable IP of the monitoring host
monitoring_vm_public_ip: "{{ monitoring_vm_ip }}"          # public/operator-facing host for browser URLs; defaults to the private IP
# Legacy VM IPs (docker-compose path, replaced by k3s in Sprint 2 extension)
application_vm_ip: "<UNUSED_K3S_PATH>"
network_vm_ip: "<UNUSED_K3S_PATH>"
ai_vm_ip: "<UNUSED_K3S_PATH>"

# Managed database endpoint — SET PER-INVENTORY (host_vars) if you use an
# external managed DB. BYO deployments typically run their own / in-cluster DB,
# so the shared default is EMPTY (no hardwired managed-service hostname; the same
# drift class as above). Our newacct.yml sets rds_endpoint as a host_var to the
# live new-account RDS endpoint, which beats this default — live deploy unaffected.
rds_endpoint: ""
rds_port: 3306
cloudfront_domain: "<DISABLED_see_enable_cloudfront>"

common_packages:
  - curl
  - wget
  - vim
  - htop
  - net-tools
  - jq
  - unzip
  - ca-certificates
  - gnupg
  - rsync

docker_compose_version: "5.0.1"

cadvisor_port: 8081
node_port: 9100
loki_push_endpoint: "http://{{ monitoring_vm_ip }}:3100/loki/api/v1/push"
jaeger_endpoint: "http://{{ monitoring_vm_ip }}:4317"
prometheus_host: "{{ monitoring_vm_ip }}"

# Jaeger ports (needed by OTel Collector on all VMs)
jaeger_otlp_grpc_port: 4317
jaeger_host_otlp_grpc_port: 4327
loki_port: 3100

# OTel Collector
otel_collector_version: "0.120.0"
otel_collector_config_dir: /etc/otel-collector
otel_collector_grpc_port: 4317
otel_collector_http_port: 4318
otel_collector_metrics_port: 8888
otel_collector_health_port: 13133

# k3s cluster endpoint — SET PER-INVENTORY (host_vars). This is the Kubernetes
# API endpoint / k3s host the central Prometheus uses for cluster discovery and
# the k3s-node scrape target. LOUD placeholder so the preflight rejects it until
# the operator sets the real value. newacct.yml sets it as a host_var (host_vars
# beat this default) — live deploy unaffected.
k3s_host_ip: "CHANGE_ME_k3s_host_ip"
# Legacy CPU-Ollama placeholder (unused on the k3s/GPU path). The monitoring
# group's real gpu_host_ip is set in group_vars/monitoring.yml + per-host.
gpu_host_ip: "<UNUSED_CPU_OLLAMA>"
