---
# =============================================================================
# LEGACY VM PATH — superseded (audit drift A-3/A-7).
# This play targets the `ai` host group, which does NOT exist in
# inventory/newacct.yml (the GPU host is in the `gpu_triage` group). The live
# GPU triage stack is now codified by roles/triage_stack via playbooks/gpu.yml
# (which faithfully captures /opt/triage). Kept for reference only — use
# playbooks/gpu.yml for the new account.
# =============================================================================
- name: Common setup for AI/LLM hosts
  hosts: ai
  roles:
    - common
    - docker
    - nvidia_docker
    - node_exporter
    - cadvisor
  tags: [common, docker, nvidia]

- name: Deploy AI/LLM stack
  hosts: ai
  roles:
    - ollama
    - triage_service
    - mcp_servers
    - otel-collector
  tags: [ai]
  tasks:
    - name: Create stack directory
      file:
        path: "{{ stack_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy unified AI docker-compose
      template:
        src: "{{ playbook_dir }}/templates/ai-compose.yml.j2"
        dest: "{{ stack_dir }}/docker-compose.yml"
        owner: root
        group: root
        # 0640, not 0644 (NEW-1): renders SMTP_PASSWORD — not world-readable.
        mode: "0640"
      # no_log (NEW-1): renders the SMTP app-password; suppress cleartext in --diff/CI.
      no_log: true

    - name: Start AI stack
      community.docker.docker_compose_v2:
        project_src: "{{ stack_dir }}"
        state: present
        recreate: always
      register: ai_stack_result

    - name: Wait for Ollama
      uri:
        url: "http://localhost:{{ ollama_port }}/api/tags"
        status_code: 200
      retries: 24
      delay: 10
      until: ollama_health.status == 200
      register: ollama_health

    - name: Pull Ollama model
      command: "docker exec ollama ollama pull {{ ollama_model }}"
      register: ollama_pull
      changed_when: "'pulling' in ollama_pull.stdout"
      retries: 3
      delay: 10

    - name: Wait for Triage Service
      uri:
        url: "http://localhost:{{ triage_service_port }}/health"
        status_code: 200
      retries: 12
      delay: 5
      until: triage_health.status == 200
      register: triage_health

    - name: Wait for OTel Collector
      uri:
        url: "http://localhost:{{ otel_collector_health_port }}/"
        status_code: 200
      retries: 12
      delay: 5
      until: otel_health.status == 200
      register: otel_health
