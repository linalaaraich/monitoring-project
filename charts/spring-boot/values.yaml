# WS-1 (2026-06-04): Operator-facing app name. The chart directory,
# `.Chart.Name`, and the rendered Deployment/Service name all stay
# `spring-boot` (chaos scripts + demo scripts reference deploy/spring-boot
# by name; the image's container name is also `spring-boot`). The
# `app.kubernetes.io/name` label is overridden to the domain-meaningful
# `employees-backend` (the image is the mukundmadhav employee-CRUD demo;
# /api/employee). Prom's existing `labelmap` rule on
# `__meta_kubernetes_pod_label_(.+)` promotes this to the
# `app_kubernetes_io_name="employees-backend"` metric label, which Grafana
# dashboards and alert rules can select on alongside the existing
# `container="spring-boot"` selector.
nameOverride: "employees-backend"
fullnameOverride: "spring-boot"

replicaCount: 1

image:
  repository: mukundmadhav/react-springboot-mysql
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# RDS connection (from Terraform outputs).
# Prefer passing `host` via --set on install; the chart composes the JDBC
# URL from host/port/name so the caller doesn't have to remember the
# jdbc:mysql:// prefix. `url` still wins if explicitly set.
database:
  host: ""       # e.g. observability-rca-mysql.xxx.us-east-1.rds.amazonaws.com
  port: 3306
  name: "app_db"
  url: ""        # takes precedence over host/port/name when non-empty
  username: "appuser"
  password: ""

# OTel Java Agent.
# WS-1 (2026-06-04): service.name is now the operator-facing app token
# (`employees-backend`) so Loki streams, Jaeger traces, and the triage
# `alert.service` label all key on the same string. The legacy
# `spring-boot` token is still recognised by the triage SERVICE_TYPE +
# service_deployment_type maps for backwards-compatible RCA history
# lookups.
otel:
  enabled: true
  agentVersion: "2.11.0"
  serviceName: "employees-backend"
  exporterEndpoint: "http://otel-collector.observability.svc.cluster.local:4317"

# Spring Boot's default log level is INFO which emits very few lines under
# steady traffic — nothing meaningful per request. For a demo where we want
# to show log→trace click-through on every request, bump the Spring Web
# logger to DEBUG (Spring + Tomcat log per request, all lines carry
# trace_id via LOGGING_PATTERN_LEVEL). Set to "INFO" for production.
logging:
  webLogLevel: "DEBUG"

# Prometheus scraping annotations
prometheus:
  scrape: true
  port: 8080
  path: /actuator/prometheus

serviceAccount:
  create: true
  name: ""
